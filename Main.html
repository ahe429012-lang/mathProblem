<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>New webpage</title>
         <style>
         #start{
            width: 245px;
            height:90px;
            margin:150px;
            background-color:rgb(0, 255, 51);
            border-radius:35px;
            }
        </style>
        
       
           
    </head>
    <body>
      <button id="start">Start</button>
      <h3 id="x">
          1
      </h3>
      <h3>*</h3>
      <h3 id="y">
          1
      </h3>
      <h3>=
          
      </h3>
      <h3 id="mark">
          N/A
      </h3>
      <input id="myAns">
      <h3 id="score">0/15
          
      </h3>
      <h3 id="timerDisplay">60
          
      </h3>
      <script>
      
            var x;
            var y;
            var ans;
            let timeLeft=60;
            var timerDisplay = document.getElementById("timerDisplay");
            function endQuiz(){
                myAns.disabled= true;
                start===false;
            }
            var timer = setInterval(function(){
                timeLeft--;

    timerDisplay.textContent =
        "Time: " + timeLeft;

    if (timeLeft <= 0) {
        endQuiz();
    }

}, 1000);
            
            x=1;
            y=1;
            ans=x*y
            const start = false;
            var myAns = document.getElementById("myAns")
            var userAnswer = Number(myAns.value);
            var mark = document.getElementById("mark")
            var correct = 0;
        function start(){
            start = true;
            var questions = 0;
        }
            function updateNum(){
                var qX=document.getElementById("x");
                var qY=document.getElementById("y");
                qX.textContent=x;
                qY.textContent=y;
        }
        function problem(){
            x=rand(1,10);
            y=rand(1,10);
            ans=x*y;
            updateNum();
           await sleep(15000);
           if (ans === userAnswer){
               mark.textContent = "Correct";
               correct++;
           }
           else{
               mark.textContent = "Incorrect";
           }
           
        }
        
        const button = document.getElementById("start")
        button.addEventListener("click", start);
            if(start===true){
              for(questions<15;questions++;) problem();
            }
            
            var score = correct/questions;
            var scoreBoard=document.getElementById("score")
            scoreBoard.textContent= score;
        </script>

    </body>
</html>
